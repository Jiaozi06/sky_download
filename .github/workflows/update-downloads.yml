name: 更新光遇下载链接

on:
  schedule:
    - cron: '4,14,24,34,44,54 * * * *'
  workflow_dispatch:
    inputs:
      refresh_honor:
        description: 即使网易版本未变也查询荣耀
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-downloads.yml'

permissions:
  contents: write

concurrency:
  group: update-downloads
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        id: checkout
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: 分别检查国服和国际服版本
        run: python3 scripts/update_downloads.py
      - name: 判断是否刷新荣耀渠道
        id: honor
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          REFRESH_HONOR: ${{ inputs.refresh_honor }}
        run: |
          before=$(git show HEAD:downloads.json | jq -r '.official_version_code')
          after=$(jq -r '.official_version_code' downloads.json)
          honor=$(jq -r '.channels.honor.version_code // 0' downloads.json)
          verified=$(jq -r '.channels.honor.verified // false' downloads.json)
          if [[ "$before" != "$after" || "$REFRESH_HONOR" == true || "$honor" -lt "$after" || "$verified" != true ]]; then
            echo 'refresh=true' >> "$GITHUB_OUTPUT"
          fi
      - name: 启用 Android 模拟器加速
        if: ${{ !cancelled() && steps.honor.outputs.refresh == 'true' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 从荣耀应用市场获取 APK 地址
        id: honor_refresh
        if: ${{ !cancelled() && steps.honor.outputs.refresh == 'true' }}
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@69c8581131285561115a2e413eb0037446bdc2d6 # v2.35.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 4096 -cores 2
          script: |
            adb root
            adb wait-for-device
            adb shell setprop msc.sys.country CN
            adb shell setprop gsm.sim.operator.iso-country cn
            adb shell setprop gsm.operator.iso-country cn
            adb shell settings put system system_locales zh-CN
            adb shell settings put global hide_error_dialogs 1
            test "$(adb shell getprop msc.sys.country | tr -d '\r')" = CN
            curl -fL --retry 2 -o "$RUNNER_TEMP/honor-market.apk" https://www.honor.com/content/dam/honor/cn/tech/honor-app-market/img/AppMarket_16.0.40.305_productRelease_20250904152045_ab.apk || { echo '::error::荣耀应用市场 APK 下载失败'; exit 1; }
            echo "548cfe35fe9ce04e15ce11f5861f888ed886d6a5bb28cc378ee9c684b94ee71f  $RUNNER_TEMP/honor-market.apk" | sha256sum -c - || { echo '::error::荣耀应用市场 APK 校验失败'; exit 1; }
            result=$(adb install "$RUNNER_TEMP/honor-market.apk" 2>&1) || { echo "::error::荣耀应用市场安装失败：$result"; exit 1; }
            adb shell cmd locale set-app-locales com.hihonor.appmarket --user 0 --locales zh-CN || { echo '::error::荣耀应用市场语言设置失败'; exit 1; }
            adb shell am force-stop com.google.android.apps.nexuslauncher
            python3 scripts/update_honor.py
      - name: 提交变更
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: |
          git add -- downloads.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '更新光遇下载链接'
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
      - name: 报告荣耀刷新失败
        if: ${{ !cancelled() && steps.honor_refresh.outcome == 'failure' }}
        run: |
          echo '::error::荣耀刷新失败，已保留上次链接；后续运行将继续重试。'
          exit 1
